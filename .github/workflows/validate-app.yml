name: Validate Olatuns App
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-app
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML structure, navigation, IDs, and inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m=>m[1]);
          const duplicates=ids.filter((id,i)=>ids.indexOf(id)!==i);
          if(duplicates.length) throw Error('Duplicate HTML IDs: '+[...new Set(duplicates)].join(', '));
          const pages=[...html.matchAll(/<section\b[^>]*class=["'][^"']*\bpage\b[^"']*["'][^>]*id=["']([^"']+)["']/gi)].map(m=>m[1]);
          const nav=[...html.matchAll(/data-page=["']([^"']+)["']/g)].map(m=>m[1]);
          const missing=nav.filter(p=>!pages.includes(p));
          if(missing.length) throw Error('Navigation points to missing pages: '+missing.join(', '));
          const onclick=[...html.matchAll(/onclick=["'][^"']*go\(['"]([^'"]+)['"]\)[^"']*["']/g)].map(m=>m[1]);
          const missingGo=onclick.filter(p=>!pages.includes(p));
          if(missingGo.length) throw Error('go() points to missing pages: '+[...new Set(missingGo)].join(', '));
          const scripts=[...html.matchAll(/<script\\b[^>]*src=[\"']([^\"']+)[\"'][^>]*>/gi)].map(m=>m[1]).filter(src=>src.startsWith('./'));
          if(!scripts.some(src=>src.startsWith('./app-core.js?')) || !scripts.some(src=>src.startsWith('./app-auth.js?'))) throw Error('Required app scripts are not linked');
          for(const src of scripts){const file=src.split('?')[0].replace(/^\\.\\//,'');if(!fs.existsSync(file))throw Error('Missing local script: '+file);}
          if(!/<link[^>]+href=[\"']\\.\\/styles\\.css\\?v=20261120-2[\"'][^>]*>/i.test(html)||!fs.existsSync('styles.css'))throw Error('App stylesheet is missing');
          console.log('HTML checks passed: '+ids.length+' IDs, '+pages.length+' pages, '+scripts.length+' local app scripts.');
          NODE
          node --check app-core.js
          node --check app-auth.js
