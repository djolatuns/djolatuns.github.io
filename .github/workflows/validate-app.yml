name: Validate Olatuns App
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-app
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate required app assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app-core.js
          test -s app-cloud.js
          test -s manifest.webmanifest
          test -s icon.svg
          test -s booking.html
          test -s admin.html
          test -s src-tauri/icons/icon.png
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "const p=require('./package.json');const t=require('./src-tauri/tauri.conf.json');if(p.version!=='1.1.0'||t.version!==p.version)throw Error('App versions must match at 1.1.0')"
      - name: Validate HTML IDs, page navigation and assets
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m=>m[1]);
          const duplicates=ids.filter((id,i)=>ids.indexOf(id)!==i);
          if(duplicates.length) throw Error('Duplicate IDs: '+[...new Set(duplicates)].join(', '));
          const pages=[...html.matchAll(/<section\b[^>]*class=["'][^"']*\bpage\b[^"']*["'][^>]*id=["']([^"']+)["']/gi)].map(m=>m[1]);
          const nav=[...html.matchAll(/data-page=["']([^"']+)["']/g)].map(m=>m[1]);
          const missing=nav.filter(p=>!pages.includes(p));
          if(missing.length) throw Error('Navigation points to missing pages: '+missing.join(', '));
          for(const asset of ['styles.css','app-core.js','app-cloud.js','manifest.webmanifest','icon.svg']) if(!html.includes(asset)) throw Error('Missing asset reference: '+asset);
          if(html.split('app-cloud.js').length-1!==1) throw Error('app-cloud.js must be loaded exactly once.');
          if(html.includes('const SUPABASE_URL')) throw Error('Supabase initialization must live only in app-cloud.js.');
          const cloud=fs.readFileSync('app-cloud.js','utf8');
          if(cloud.split('createClient(').length-1!==1) throw Error('Expected exactly one Supabase client initialization.');
          if(html.includes('Creator Studio')||html.includes('data-page="drafts"')) throw Error('Obsolete Creator Studio navigation found.');
          if(!html.includes('app-cloud.js?v=7')||!html.includes('app-core.js?v=3')) throw Error('App script cache-busting version is stale.');
          if(!html.includes('booking.html')) throw Error('Public booking link is missing.');
          const core=fs.readFileSync('app-core.js','utf8');
          if(!core.includes('requestedPage')) throw Error('Notification deep links are not supported.');
          const sw=fs.readFileSync('sw.js','utf8');
          if(!sw.includes('olatuns-shell-v8')||!sw.includes('styles.css?v=5')||!sw.includes('app-core.js?v=3')||!sw.includes('./booking.html')||!sw.includes('./admin.html')) throw Error('Service worker shell cache is stale.');
          if(cloud.indexOf('let isOlatunsAdmin')>cloud.indexOf('cloud.auth.onAuthStateChange')) throw Error('Community state must initialize before auth events.');
          if(!cloud.includes('resetCloudProfile')||!cloud.includes("username_available")) throw Error('Account reset or username availability protection is missing.');
          if(!cloud.includes('video/webm')||!cloud.includes('postvideo')) throw Error('Community video upload or playback is missing.');
          const booking=fs.readFileSync('booking.html','utf8');
          const admin=fs.readFileSync('admin.html','utf8');
          if(!booking.includes("action:'booking-created'")||!admin.includes("from('booking_requests')")) throw Error('Booking submission or admin management is incomplete.');
          const download=fs.readFileSync('download.html','utf8');
          if(!download.includes('downloads/DJ-Olatuns.apk')) throw Error('Direct APK download link is missing.');
          const smoke=fs.readFileSync('.github/scripts/live-smoke.cjs','utf8');
          if(smoke.includes("'drafts'")||smoke.includes('"drafts"')) throw Error('Live smoke test still expects the removed drafts page.');
          if(!smoke.includes("const expected=['home','mixtapes','discover','community','profile','about'];")) throw Error('Live smoke test page list is out of date.');
          console.log('Passed: '+ids.length+' IDs; '+pages.length+' pages; '+nav.length+' navigation links; single Supabase client and current smoke checks.');
          NODE
      - name: Check JavaScript syntax
        run: |
          node --check app-core.js
          node --check app-cloud.js
          node --check .github/scripts/live-smoke.cjs
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for(const file of ['booking.html','admin.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
            if(!scripts.length) throw Error('No inline JavaScript found in '+file);
            scripts.forEach((source,index)=>new vm.Script(source,{filename:file+' inline '+index}));
          }
          NODE
