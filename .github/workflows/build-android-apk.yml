name: Build DJ OLATUNS Android Release Bundle

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate launcher icon resources
        run: |
          mkdir -p android/app/src/main/res
          curl -fsSL https://djolatuns.github.io/icon-circle.svg -o /tmp/dj-olatuns-icon.svg
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            dir="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/$dir"
            convert -background none /tmp/dj-olatuns-icon.svg -resize "${size}x${size}" "android/app/src/main/res/$dir/ic_launcher.png"
            cp "android/app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/ic_launcher_round.png"
          done

      - name: Build release app bundle
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon bundleRelease

      - name: Upload unsigned release AAB for signing setup
        uses: actions/upload-artifact@v4
        with:
          name: DJ-OLATUNS-Release-AAB-Unsigned-IconReady
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
