name: Build DJ OLATUNS Android Release Bundle

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify native launcher icon resources
        run: |
          test -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f android/app/src/main/res/drawable/dj_olatuns_icon_foreground.xml
          test -f android/app/src/main/res/values/dj_olatuns_icon.xml

      - name: Build release app bundle
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon bundleRelease

      - name: Upload unsigned release AAB for signing setup
        uses: actions/upload-artifact@v4
        with:
          name: DJ-OLATUNS-Release-AAB-Unsigned-IconReady
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
