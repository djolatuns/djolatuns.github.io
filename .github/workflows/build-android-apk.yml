name: Build DJ OLATUNS Signed Android Release Bundle

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify native launcher icon resources
        run: |
          test -f android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test -f android/app/src/main/res/drawable/dj_olatuns_icon_foreground.xml
          test -f android/app/src/main/res/values/dj_olatuns_icon.xml

      - name: Restore private Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dj-olatuns-upload.jks"
          chmod 600 "$RUNNER_TEMP/dj-olatuns-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dj-olatuns-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release app bundle
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon bundleRelease

      - name: Verify signed Android App Bundle
        run: |
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DJ-OLATUNS-Release-AAB-Signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dj-olatuns-upload.jks"
