name: DJ Olatuns Platform Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'index.html'
      - 'app-core.js'
      - 'app-cloud.js'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'booking.html'
      - 'admin.html'
      - 'admin-upload.html'
      - 'download.html'
      - 'icon*.svg'
      - '.github/workflows/platform-builds.yml'
      - 'src-tauri/**'

concurrency:
  group: platform-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate Android SDK manager and install required packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Runner did not provide ANDROID_HOME/ANDROID_SDK_ROOT. Searching common locations."
            for candidate in /usr/local/lib/android/sdk /opt/android-sdk /usr/local/android-sdk; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK not found. Runner environment:"
            env | grep -E 'ANDROID|SDK' || true
            exit 1
          fi
          echo "Using Android SDK: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found. Android SDK directory contents:"
            ls -la "$SDK_ROOT" || true
            ls -la "$SDK_ROOT/cmdline-tools" || true
            exit 1
          fi
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          echo "License acceptance completed; package installation will verify access."
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"

      - run: npm install
      - run: npm run prepare:web
      - run: npx cap add android
      - name: Set Android app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'(?m)^(\s*versionCode\s+)\d+', r'\g<1>2', s)
          s = re.sub(r"""(?m)^(\s*versionName\s+)["'][^"']+["']""", r'\g<1>"1.1.0"', s)
          p.write_text(s)
          PY
      - run: npm run cap:sync
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dj-olatuns-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Generate Windows/macOS application icons
        run: npx tauri icon src-tauri/icons/icon.png --output src-tauri/icons
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: dj-olatuns-windows-installer
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Generate Windows/macOS application icons
        run: npx tauri icon src-tauri/icons/icon.png --output src-tauri/icons
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: dj-olatuns-macos-installer
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
