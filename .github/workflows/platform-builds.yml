name: DJ Olatuns Platform Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'index.html'
      - 'app-core.js'
      - 'app-cloud.js'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'booking.html'
      - 'admin.html'
      - 'admin-upload.html'
      - 'download.html'
      - 'icon*.svg'
      - '.github/workflows/platform-builds.yml'
      - 'src-tauri/**'

concurrency:
  group: platform-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - run: npm run prepare:web
      - run: npx cap add android
      - name: Set Android app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'(?m)^(\s*versionCode\s+)\d+', r'\g<1>2', s)
          s = re.sub(r"""(?m)^(\s*versionName\s+)["'][^"']+["']""", r'\g<1>"1.1.0"', s)
          p.write_text(s)
          PY
      - run: npm run cap:sync
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dj-olatuns-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: dj-olatuns-windows-installer
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: dj-olatuns-macos-installer
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
