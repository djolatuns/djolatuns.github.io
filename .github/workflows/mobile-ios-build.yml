name: DJ Olatuns iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'index.html'
      - 'app-core.js'
      - 'app-cloud.js'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'booking.html'
      - 'admin.html'
      - 'admin-upload.html'
      - 'download.html'
      - 'icon*.svg'
      - '.github/workflows/mobile-ios-build.yml'

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx cap add ios
      - name: Set iOS app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          p = Path('ios/App/App/Info.plist')
          data = plistlib.loads(p.read_bytes())
          data['CFBundleShortVersionString'] = '1.1.0'
          data['CFBundleVersion'] = '2'
          p.write_bytes(plistlib.dumps(data))
          PY
      - run: npm run cap:sync
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build build
      - uses: actions/upload-artifact@v4
        with:
          name: dj-olatuns-ios-simulator-build
          path: build/Build/Products/Debug-iphonesimulator/App.app
