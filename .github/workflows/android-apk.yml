name: DJ Olatuns Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'index.html'
      - 'app-core.js'
      - 'app-cloud.js'
      - 'styles.css'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'booking.html'
      - 'admin.html'
      - 'admin-upload.html'
      - 'download.html'
      - 'icon*.svg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: dj-olatuns-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK manager and install required packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Runner did not provide ANDROID_HOME/ANDROID_SDK_ROOT. Searching common locations."
            for candidate in /usr/local/lib/android/sdk /opt/android-sdk /usr/local/android-sdk; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK not found. Runner environment:"
            env | grep -E 'ANDROID|SDK' || true
            exit 1
          fi
          echo "Using Android SDK: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found. Android SDK directory contents:"
            ls -la "$SDK_ROOT" || true
            ls -la "$SDK_ROOT/cmdline-tools" || true
            exit 1
          fi
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          echo "License acceptance completed; package installation will verify access."
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Verify prepared web assets
        run: |
          test -f dist/index.html
          test -f dist/app-core.js
          test -f dist/app-cloud.js
          echo "Web bundle ready. Files: $(find dist -maxdepth 1 -type f | wc -l)"

      - name: Add Android platform
        run: npx cap add android

      - name: Set Android app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = re.sub(r'(?m)^(\s*versionCode\s+)\d+', r'\g<1>2', s)
          s = re.sub(r"""(?m)^(\s*versionName\s+)["'][^"']+["']""", r'\g<1>"1.1.0"', s)
          p.write_text(s)
          PY
      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          echo "Android project generated."

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Verify APK package, signature and install metadata
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          echo "===== APK package metadata ====="
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.djolatuns.app'" apk-badging.txt
          echo "===== APK signature verification ====="
          "$APKSIGNER" verify --verbose "$APK"
          echo "===== APK file details ====="
          sha256sum "$APK"
          ls -lh "$APK"
          echo "APK integrity and package checks passed."

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Olatuns-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK for direct Chrome download
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/DJ-Olatuns.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/DJ-Olatuns.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; no publish commit needed."
          else
            git commit -m "Publish latest DJ Olatuns Android APK"
            # The APK build can finish after other commits have landed on main.
            # Rebase the publish commit onto the latest main and retry the push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "APK published successfully."
                exit 0
              fi
              echo "Push attempt $attempt failed; refreshing main and retrying."
              sleep 2
            done
            echo "Unable to publish APK after 5 attempts."
            exit 1
          fi

      - name: Build diagnostics on failure
        if: failure()
        run: |
          echo "===== Versions ====="
          node --version || true
          npm --version || true
          java -version || true
          echo "===== Android SDK ====="
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -n "$SDKMANAGER" ]; then "$SDKMANAGER" --list_installed || true; else echo "sdkmanager missing"; fi
          echo "===== Repository root ====="
          ls -la || true
          echo "===== Generated Android project ====="
          ls -la android || true
          echo "===== Gradle outputs ====="
          find android -maxdepth 5 -type f \( -name "*.apk" -o -name "*.log" \) 2>/dev/null | head -100 || true
