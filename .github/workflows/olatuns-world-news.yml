name: Refresh OLATUNS WORLD news
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: olatuns-world-news
  cancel-in-progress: false
jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch attributed RSS headlines
        run: node olatuns-world/scripts/update-world-feed.mjs
      - name: Commit feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add olatuns-world/data/updates.json
          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "Refresh OLATUNS WORLD news feed"
            git push
          fi
