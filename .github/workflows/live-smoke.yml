name: Live Olatuns App smoke test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-core.js'
      - 'app-cloud.js'
      - 'styles.css'
      - 'sw.js'
      - 'booking.html'
      - 'admin.html'
      - 'admin-upload.html'
      - '.github/scripts/live-smoke.cjs'
      - '.github/workflows/live-smoke.yml'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test the actual published website
        run: node .github/scripts/live-smoke.cjs
