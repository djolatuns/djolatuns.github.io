<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="robots" content="noindex,nofollow"><title>DJ Olatuns · Admin Upload</title><link rel="stylesheet" href="styles.css?v=5"><style>
.admin-shell{max-width:760px;margin:auto;padding:18px 14px 40px}.admin-hero{border:1px solid #4b391c;border-radius:20px;padding:20px;background:radial-gradient(ellipse at top right,#3b2a16,transparent 65%),#121212}.topline{display:flex;justify-content:space-between;align-items:center}.topline a{color:#d6b257;text-decoration:none}.panel{margin-top:16px;border:1px solid #2b2b2b;background:#141414;border-radius:16px;padding:16px}.release-row{display:flex;gap:12px;align-items:center;border:1px solid #282828;border-radius:14px;padding:12px;margin-top:10px;background:#131313}.release-row img,.cover-placeholder{width:64px;height:64px;object-fit:cover;border-radius:10px}.cover-placeholder{display:grid;place-items:center;background:#352614;color:#d6b257}.details{flex:1;min-width:0}.details h3{margin:0 0 4px;font-size:14px}.details p{font-size:12px;margin:3px 0}.status{color:#d6b257;min-height:22px;font-size:12px}.preview{max-width:130px;max-height:150px;object-fit:cover;border-radius:10px}
</style></head><body><div class="admin-shell"><div class="admin-hero"><div class="topline"><a href="./">← Back to app</a><button class="btn secondary" id="signout" type="button">Sign out</button></div><div class="eyebrow" style="margin-top:18px">OLATUNS · RESTRICTED</div><h1 style="font-size:38px">Mixtape Upload.</h1><p>Upload releases directly into the official mixtape library. Published releases become available to signed-in members.</p></div>
<div id="authCard" class="panel"><h2>Administrator sign in</h2><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Sign in</button></form><div id="authStatus" class="status"></div></div>
<section id="uploadSection" style="display:none"><form id="uploadForm" class="panel"><h2>New mixtape</h2><div class="field"><label>Title</label><input id="title" required maxlength="100" placeholder="Mixtape title"></div><div class="field"><label>Description</label><textarea id="description" rows="3" maxlength="600" placeholder="Release description"></textarea></div><div class="field"><label>Audio (MP3, AAC, WAV, OGG, WebM · max 100 MB)</label><input id="audio" type="file" required accept="audio/mpeg,audio/mp4,audio/aac,audio/ogg,audio/wav,audio/x-wav,audio/webm"><div class="small" id="audioInfo"></div></div><div class="field"><label>Artwork (optional · JPG, PNG or WebP · max 5 MB)</label><input id="cover" type="file" accept="image/jpeg,image/png,image/webp"><div id="coverPreview"></div></div><label><input id="publish" type="checkbox" checked> Publish immediately</label><button class="btn" type="submit" style="width:100%;margin-top:14px">Upload mixtape</button><div class="status" id="uploadStatus" aria-live="polite"></div></form><div class="section"><h2>Library · plays & follows</h2><div id="releaseList">Loading releases…</div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js"></script><script>
const SUPABASE_URL='https://tiqracqtgggoctyvtuqo.supabase.co',SUPABASE_KEY='sb_publishable_9UYttF-UC-2xgb6KBYBvLQ_4rCob3LO';const cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,isAdmin=false,coverFile=null;const $=id=>document.getElementById(id);function msg(id,s){$(id).textContent=s||''}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function checkSession(session){user=session?.user||null;if(!user){isAdmin=false;$('authCard').style.display='block';$('uploadSection').style.display='none';return}const {data,error}=await cloud.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!data&&!error;if(!isAdmin){msg('authStatus','This account is not authorised for administration.');await cloud.auth.signOut();return}$('authCard').style.display='none';$('uploadSection').style.display='block';await loadReleases()}
cloud.auth.onAuthStateChange((event,session)=>{checkSession(session)});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg('authStatus','Signing in…');const {error}=await cloud.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg('authStatus',error.message)});
$('signout').addEventListener('click',async()=>{await cloud.auth.signOut();location.href='./'});
$('audio').addEventListener('change',e=>{const f=e.target.files?.[0];$('audioInfo').textContent=f?f.name+' · '+(f.size/1024/1024).toFixed(1)+' MB':''});
$('cover').addEventListener('change',e=>{coverFile=e.target.files?.[0]||null;$('coverPreview').innerHTML='';if(!coverFile)return;if(!['image/jpeg','image/png','image/webp'].includes(coverFile.type)||coverFile.size>5*1024*1024){coverFile=null;e.target.value='';$('coverPreview').textContent='Choose JPG, PNG or WebP artwork under 5 MB.';return}const img=document.createElement('img');img.className='preview';img.alt='Cover preview';img.src=URL.createObjectURL(coverFile);$('coverPreview').appendChild(img)});
function ext(file){return ({'audio/mpeg':'mp3','audio/mp4':'m4a','audio/aac':'aac','audio/ogg':'ogg','audio/wav':'wav','audio/x-wav':'wav','audio/webm':'webm','image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type]}
$('uploadForm').addEventListener('submit',async e=>{e.preventDefault();if(!isAdmin||!user)return;const audio=$('audio').files[0],title=$('title').value.trim(),description=$('description').value.trim();if(!audio||!title)return;if(audio.size>100*1024*1024){msg('uploadStatus','Audio is larger than 100 MB.');return}if(!ext(audio)){msg('uploadStatus','Unsupported audio file type.');return}const button=e.target.querySelector('button[type=submit]');button.disabled=true;msg('uploadStatus','Uploading audio…');const base=user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8),audioPath=base+'.'+ext(audio);let coverPath=null;try{let {error}=await cloud.storage.from('olatuns-mixtapes').upload(audioPath,audio,{upsert:false,contentType:audio.type});if(error)throw error;if(coverFile){msg('uploadStatus','Uploading cover…');coverPath=base+'-cover.'+ext(coverFile);({error}=await cloud.storage.from('olatuns-mixtapes').upload(coverPath,coverFile,{upsert:false,contentType:coverFile.type}));if(error)throw error}msg('uploadStatus','Saving release…');({error}=await cloud.from('olatuns_mixtapes').insert({title,description,cover_path:coverPath,audio_path:audioPath,published:$('publish').checked,created_by:user.id}));if(error)throw error;e.target.reset();coverFile=null;$('coverPreview').innerHTML='';$('audioInfo').textContent='';msg('uploadStatus','Uploaded successfully. The mixtape is saved in the library.');await loadReleases()}catch(err){if(audioPath)await cloud.storage.from('olatuns-mixtapes').remove([audioPath]);if(coverPath)await cloud.storage.from('olatuns-mixtapes').remove([coverPath]);msg('uploadStatus','Upload failed: '+(err.message||'Please try again.'))}finally{button.disabled=false}});
async function loadReleases(){if(!isAdmin)return;const el=$('releaseList');const {data,error}=await cloud.from('olatuns_mixtapes').select('id,title,description,cover_path,published,play_count,created_at').order('created_at',{ascending:false});if(error){el.textContent='Unable to load library: '+error.message;return}if(!data?.length){el.innerHTML='<div class="card">No uploaded mixtapes yet.</div>';return}const coverPaths=data.filter(x=>x.cover_path).map(x=>x.cover_path);let urls=new Map();if(coverPaths.length){const {data:signed}=await cloud.storage.from('olatuns-mixtapes').createSignedUrls(coverPaths,3600);(signed||[]).forEach((x,i)=>{if(x.signedUrl)urls.set(coverPaths[i],x.signedUrl)})}const {data:follows}=await cloud.from('olatuns_mixtape_follows').select('mixtape_id');const counts={};(follows||[]).forEach(x=>counts[x.mixtape_id]=(counts[x.mixtape_id]||0)+1);el.innerHTML=data.map(m=>'<div class="release-row">'+(urls.get(m.cover_path)?'<img src="'+esc(urls.get(m.cover_path))+'" alt="Artwork">':'<div class="cover-placeholder">♫</div>')+'<div class="details"><h3>'+esc(m.title)+'</h3><p>'+esc(m.published?'Published':'Draft')+' · '+Number(m.play_count||0).toLocaleString()+' plays · '+(counts[m.id]||0)+' follows</p><p>'+esc(m.description||'')+'</p></div><button class="btn danger" onclick="deleteRelease(\''+m.id+'\')">Delete</button></div>').join('')}
async function deleteRelease(id){if(!isAdmin||!confirm('Delete this mixtape?'))return;const {data,error}=await cloud.from('olatuns_mixtapes').select('audio_path,cover_path').eq('id',id).maybeSingle();if(error||!data){msg('uploadStatus','Could not fetch mixtape files.');return}const paths=[data.audio_path,data.cover_path].filter(Boolean);if(paths.length){const {error:storageError}=await cloud.storage.from('olatuns-mixtapes').remove(paths);if(storageError){msg('uploadStatus','File deletion failed: '+storageError.message);return}}const {error:deleteError}=await cloud.from('olatuns_mixtapes').delete().eq('id',id);if(deleteError){msg('uploadStatus','Delete failed: '+deleteError.message);return}msg('uploadStatus','Mixtape deleted.');await loadReleases()}
</script></body></html>
